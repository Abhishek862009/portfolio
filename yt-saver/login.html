<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#E9EDF2; --ink:#101828; --muted:#5B6677; --cobalt:#1F3DFF; --error:#B42318; box-sizing:border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  html { background: var(--paper); }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px;
    font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); }
  main { width:100%; max-width:380px; }
  h1 { font-size:2.4rem; line-height:1.05; letter-spacing:-0.03em; font-weight:800; margin:0 0 24px; }
  input { width:100%; font:inherit; padding:14px 16px; border:2px solid var(--ink); border-radius:10px; background:#fff; color:var(--ink); }
  button { width:100%; margin-top:10px; font:inherit; font-weight:600; cursor:pointer; padding:14px 20px;
    border:2px solid var(--cobalt); background:var(--cobalt); color:#fff; border-radius:10px; }
  button:disabled { opacity:.55; cursor:wait; }
  :focus-visible { outline:3px solid var(--cobalt); outline-offset:2px; }
  .msg { min-height:1.5em; margin:12px 0 0; color:var(--error); font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Enter password</h1>
  <input id="pw" type="password" autocomplete="current-password" aria-label="Password" autofocus>
  <button id="go">Log in</button>
  <p id="msg" class="msg" role="alert"></p>
</main>
<script>
  const BASE = (location.pathname === "/yt-saver" || location.pathname.startsWith("/yt-saver/")) ? "/yt-saver" : "";  // served at arvish.xyz/yt-saver, or at / when run on its own
  const pw = document.getElementById("pw"), go = document.getElementById("go"), msg = document.getElementById("msg");
  async function login() {
    if (!pw.value) return;
    go.disabled = true; msg.textContent = "";
    try {
      const r = await fetch(BASE + "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw.value }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || "Login failed.");
      location.href = BASE + "/";
    } catch (e) {
      msg.textContent = e.message;
      pw.select();
    } finally {
      go.disabled = false;
    }
  }
  go.addEventListener("click", login);
  pw.addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });
</script>
</body>
</html>
